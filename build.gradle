plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral(); maven { url 'https://maven.fabricmc.net/' } }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
